<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatNova AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">✨ ChatNova AI</div>
        <ul class="menu-items">
            <li data-category="Coding">💻 Coding</li>
            <li data-category="Schedule">📅 Schedule</li>
            <li data-category="AI Learning">🧠 AI Learning</li>
            <li data-category="Library">📚 Library</li>
            <li data-category="Projects">📁 Projects</li>
        </ul>
    </aside>

    <div class="main-content">
        <header class="app-header">
            <button class="menu-btn" id="globalMenuToggle" type="button">☰</button>
            <div class="app-title" id="dynamicTitle">ChatNova AI</div>
        </header>

        <div class="chat-display" id="chatDisplay">
            <div class="welcome-container" id="welcomeScreen">
                <h1>Hi, I'm ChatNova AI</h1>
                <p>How can I help you</p>
            </div>
        </div>

        <div class="input-area-wrapper">
            <div class="upload-popup-menu" id="uploadPopupMenu">
                <div class="upload-option" data-upload="Camera"> Camera</div>
                <div class="upload-option" data-upload="Image">Upload Image</div>
                <div class="upload-option" data-upload="File"> File</div>
            </div>
            <div class="input-box-container">
                <button class="action-btn" id="plusMenuBtn" type="button">➕</button>
                <input type="text" id="chatInputField" class="chat-input" placeholder="Message ChatNova AI..." autocomplete="off">
                <div class="input-actions-right">
                    <button class="action-btn" id="micBtn" type="button">🎙️</button>
                    <button class="action-btn send" id="sendMsgBtn" type="button">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
